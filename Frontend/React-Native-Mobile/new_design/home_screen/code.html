<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Muslim Productivity App - Home</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "surface-dark": "#1c271f",
                        "surface-light": "#ffffff",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white transition-colors duration-200">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden pb-24">
<!-- Header -->
<header class="sticky top-0 z-30 flex items-center justify-between bg-surface-light/95 dark:bg-background-dark/95 backdrop-blur-sm p-4 pb-2 border-b border-gray-200 dark:border-white/5">
<div class="flex size-10 items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-white/10 transition-colors cursor-pointer">
<span class="material-symbols-outlined text-slate-900 dark:text-white" style="font-size: 24px;">menu</span>
</div>
<div class="flex flex-col items-center">
<h2 class="text-sm font-medium text-slate-500 dark:text-[#9db9a6]">Mon, 25 Mar</h2>
<h1 class="text-base font-bold leading-tight tracking-tight text-slate-900 dark:text-white">14 Ramadan 1445</h1>
</div>
<div class="flex size-10 items-center justify-center rounded-full overflow-hidden border border-gray-200 dark:border-white/10 bg-gray-100 dark:bg-white/5">
<span class="material-symbols-outlined text-slate-600 dark:text-white" style="font-size: 24px;">account_circle</span>
</div>
</header>
<!-- Hero Card (Next Prayer) -->
<div class="p-4 w-full">
<div class="relative overflow-hidden rounded-2xl shadow-lg bg-surface-dark dark:bg-surface-dark group">
<!-- Background Image with Overlay -->
<div class="absolute inset-0 z-0">
<img alt="Abstract geometric islamic pattern or mosque silhouette against a dark sky" class="h-full w-full object-cover opacity-40 mix-blend-overlay" data-alt="Abstract geometric islamic pattern or mosque silhouette against a dark sky" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDUKf0vtcmZAwpzWjarQycGl1TPJqCqLORc2UID9WozhaEpXWRt_UNY451RqvLcC4tcnXnFnBdGwmIEjbkgCs5nKxvMbOiAumMD5RvM8gL2RlH5UY6oDPVNsqYGZhMFnDxXW3dTrfcLQIek9fJl3KGHArfW6FFYzyk_ht3zIvzY0VatpZchlmzW3erjBPID_wmT3puxqwhuNnmLi7zvmPrDQQ0tZv-CjMQOc8Fk0A5Aabj2mjD2eajc1uPG0dH3a2NV3rQxKXsaLEBj"/>
<div class="absolute inset-0 bg-gradient-to-r from-background-dark via-background-dark/90 to-transparent"></div>
</div>
<div class="relative z-10 flex flex-col md:flex-row items-start justify-between p-6 gap-6">
<div class="flex flex-col gap-1">
<span class="inline-flex items-center gap-2 text-primary font-medium text-sm tracking-wider uppercase">
<span class="material-symbols-outlined text-sm">schedule</span>
                            Next Prayer
                        </span>
<h2 class="text-4xl font-extrabold text-white tracking-tight">Maghrib</h2>
<p class="text-2xl font-semibold text-white/90">06:14 PM</p>
</div>
<div class="flex flex-col items-start md:items-end justify-end mt-2 md:mt-0">
<div class="bg-black/30 backdrop-blur-md rounded-xl p-3 border border-white/10">
<p class="text-[#9db9a6] text-xs uppercase font-semibold mb-1">Time Remaining</p>
<p class="text-primary text-3xl font-mono font-bold tracking-tight">02:30:15</p>
</div>
</div>
</div>
<!-- Progress Bar at bottom of card -->
<div class="absolute bottom-0 left-0 h-1 bg-white/10 w-full z-10">
<div class="h-full bg-primary w-[65%] rounded-r-full shadow-[0_0_10px_rgba(19,236,91,0.5)]"></div>
</div>
</div>
</div>
<!-- Scrollable Task Content -->
<div class="flex flex-col gap-2">
<!-- Section: Asr (Active) -->
<div class="flex flex-col">
<div class="sticky top-[72px] z-20 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm px-4 py-3 flex items-center justify-between border-b border-gray-100 dark:border-white/5">
<h3 class="text-slate-800 dark:text-white text-lg font-bold leading-tight flex items-center gap-2">
<span class="size-2 rounded-full bg-primary animate-pulse"></span>
                        Between Asr &amp; Maghrib
                    </h3>
<span class="text-xs font-medium px-2 py-1 rounded bg-primary/10 text-primary-700 dark:text-primary">3 Tasks</span>
</div>
<div class="px-4 py-2 flex flex-col gap-3" style="--checkbox-tick-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27rgb(16,34,22)%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3cpath d=%27M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z%27/%3e%3c/svg%3e');">
<!-- Task Item 1 -->
<label class="group flex items-center gap-4 p-4 rounded-xl bg-white dark:bg-surface-dark shadow-sm border border-gray-100 dark:border-white/5 hover:border-primary/50 transition-all cursor-pointer">
<input class="size-6 rounded-full border-gray-300 dark:border-[#3b5443] border-2 bg-transparent text-primary checked:bg-primary checked:border-primary checked:bg-[image:--checkbox-tick-svg] focus:ring-0 focus:ring-offset-0 focus:border-primary focus:outline-none transition-all" type="checkbox"/>
<div class="flex flex-col flex-1">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal group-hover:text-primary transition-colors">Read 10 pages of Quran</p>
<span class="text-xs text-slate-500 dark:text-gray-400">Daily Goal • 15 mins</span>
</div>
</label>
<!-- Task Item 2 -->
<label class="group flex items-center gap-4 p-4 rounded-xl bg-white dark:bg-surface-dark shadow-sm border border-gray-100 dark:border-white/5 hover:border-primary/50 transition-all cursor-pointer">
<input class="size-6 rounded-full border-gray-300 dark:border-[#3b5443] border-2 bg-transparent text-primary checked:bg-primary checked:border-primary checked:bg-[image:--checkbox-tick-svg] focus:ring-0 focus:ring-offset-0 focus:border-primary focus:outline-none transition-all" type="checkbox"/>
<div class="flex flex-col flex-1">
<p class="text-slate-900 dark:text-white text-base font-medium leading-normal group-hover:text-primary transition-colors">Finish Project Report</p>
<span class="text-xs text-slate-500 dark:text-gray-400">Work • High Priority</span>
</div>
<div class="size-2 rounded-full bg-red-400"></div>
</label>
<!-- Task Item 3 (Completed) -->
<label class="group flex items-center gap-4 p-4 rounded-xl bg-gray-50 dark:bg-surface-dark/40 shadow-sm border border-transparent transition-all cursor-pointer opacity-70">
<input checked="" class="size-6 rounded-full border-gray-300 dark:border-[#3b5443] border-2 bg-transparent text-primary checked:bg-primary checked:border-primary checked:bg-[image:--checkbox-tick-svg] focus:ring-0 focus:ring-offset-0 focus:border-primary focus:outline-none transition-all" type="checkbox"/>
<div class="flex flex-col flex-1">
<p class="text-slate-500 dark:text-gray-400 text-base font-medium leading-normal line-through decoration-slate-400 dark:decoration-gray-500">Grocery shopping</p>
</div>
</label>
</div>
</div>
<!-- Section: Maghrib (Next) -->
<div class="flex flex-col mt-2">
<div class="sticky top-[72px] z-20 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm px-4 py-3 flex items-center justify-between border-b border-gray-100 dark:border-white/5">
<h3 class="text-slate-500 dark:text-gray-400 text-lg font-bold leading-tight">Between Maghrib &amp; Isha</h3>
</div>
<div class="px-4 py-2">
<div class="flex flex-col items-center justify-center rounded-xl border-2 border-dashed border-gray-200 dark:border-white/10 p-8 text-center bg-gray-50/50 dark:bg-white/5">
<div class="bg-gray-200 dark:bg-white/10 rounded-full p-3 mb-3">
<span class="material-symbols-outlined text-slate-400 dark:text-gray-500">check_circle</span>
</div>
<p class="text-slate-600 dark:text-gray-300 font-medium">No tasks added yet</p>
<p class="text-slate-400 dark:text-gray-500 text-sm mt-1">Focus on your spiritual connection.</p>
<button class="mt-4 text-primary text-sm font-bold hover:underline">Add a task</button>
</div>
</div>
</div>
<!-- Section: Isha (Future) -->
<div class="flex flex-col mt-2 opacity-50">
<div class="px-4 py-3 flex items-center justify-between border-b border-gray-100 dark:border-white/5">
<h3 class="text-slate-400 dark:text-gray-500 text-lg font-bold leading-tight">After Isha</h3>
</div>
</div>
</div>
<!-- Floating Action Button -->
<button class="fixed bottom-24 right-4 z-40 flex size-14 items-center justify-center rounded-full bg-primary text-background-dark shadow-lg shadow-primary/30 hover:bg-primary/90 hover:scale-105 active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined" style="font-size: 28px; font-weight: 600;">add</span>
</button>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 z-40 w-full bg-surface-light dark:bg-[#151d18] border-t border-gray-200 dark:border-white/5 pb-safe">
<div class="flex h-16 items-center justify-around px-2">
<button class="group flex flex-col items-center justify-center gap-1 p-2 min-w-[64px]">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="text-[10px] font-medium text-primary">Home</span>
</button>
<button class="group flex flex-col items-center justify-center gap-1 p-2 min-w-[64px]">
<span class="material-symbols-outlined text-slate-400 group-hover:text-slate-600 dark:text-gray-500 dark:group-hover:text-gray-300 transition-colors">calendar_month</span>
<span class="text-[10px] font-medium text-slate-400 group-hover:text-slate-600 dark:text-gray-500 dark:group-hover:text-gray-300 transition-colors">Calendar</span>
</button>
<button class="group flex flex-col items-center justify-center gap-1 p-2 min-w-[64px]">
<span class="material-symbols-outlined text-slate-400 group-hover:text-slate-600 dark:text-gray-500 dark:group-hover:text-gray-300 transition-colors">bar_chart</span>
<span class="text-[10px] font-medium text-slate-400 group-hover:text-slate-600 dark:text-gray-500 dark:group-hover:text-gray-300 transition-colors">Stats</span>
</button>
<button class="group flex flex-col items-center justify-center gap-1 p-2 min-w-[64px]">
<span class="material-symbols-outlined text-slate-400 group-hover:text-slate-600 dark:text-gray-500 dark:group-hover:text-gray-300 transition-colors">settings</span>
<span class="text-[10px] font-medium text-slate-400 group-hover:text-slate-600 dark:text-gray-500 dark:group-hover:text-gray-300 transition-colors">Settings</span>
</button>
</div>
</nav>
<!-- Safe area padding for iPhone home indicator -->
<div class="h-6 w-full bg-surface-light dark:bg-[#151d18] fixed bottom-0 z-30"></div>
</div>
</body></html>
